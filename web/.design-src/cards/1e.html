<div class="dv-olabel"><a class="dv-oid" href="#1e">1e</a>Progression on ink — full-bleed dark chart, coral glows. Same data, more Panorama. Wellness as a mono table.</div>
<div class="dv-card" style="width:390px">
<div style="width:390px;height:844px;background:#17140F;color:#FAF7F2;position:relative;overflow:hidden">
<div style="display:flex;justify-content:space-between;padding:14px 20px 0;font:400 11px 'Space Mono',monospace;opacity:.5"><span>9:41</span><span>5G · 82%</span></div>
<div style="display:flex;justify-content:space-between;align-items:flex-end;padding:16px 20px 6px"><div><div style="font:700 11px 'Space Mono',monospace;letter-spacing:.22em;opacity:.55">PERFORMANCE MGMT</div><div style="font:700 40px/1 'Space Grotesk',sans-serif;letter-spacing:-.035em;margin-top:8px;color:#FF6B54">71<span style="font-size:16px;color:#FAF7F2;letter-spacing:0"> CTL</span></div></div><div style="text-align:right;font:400 11px 'Space Mono',monospace;opacity:.6;line-height:1.7"><div>ATL 67</div><div>TSB +4</div><div>PEAK 74</div></div></div>
<svg viewBox="0 0 390 300" width="390" height="300" style="display:block;margin-top:10px">
<line x1="0" y1="75" x2="390" y2="75" stroke="rgba(250,247,242,.1)" stroke-width="1"></line>
<line x1="0" y1="150" x2="390" y2="150" stroke="rgba(250,247,242,.1)" stroke-width="1"></line>
<line x1="0" y1="225" x2="390" y2="225" stroke="rgba(250,247,242,.1)" stroke-width="1"></line>
<path d="{{ darkAtl }}" fill="none" stroke="#E7A82E" stroke-width="1.6"></path>
<path d="{{ darkCtlArea }}" fill="rgba(255,107,84,.2)"></path>
<path d="{{ darkCtl }}" fill="none" stroke="#FF6B54" stroke-width="3.4" stroke-linejoin="round"></path>
</svg>
<div style="display:flex;justify-content:space-between;padding:8px 20px 0;font:400 9.5px 'Space Mono',monospace;opacity:.4"><span>{{ axisStart }}</span><span>{{ axisMid }}</span><span>TODAY</span></div>
<div style="display:flex;gap:6px;padding:16px 20px 0">
<sc-for list="{{ ranges }}" as="r" hint-placeholder-count="3">
<div onClick="{{ r.pick }}" style="padding:7px 14px;border-radius:999px;font:700 10px 'Space Mono',monospace;letter-spacing:.1em;cursor:pointer;background:{{ r.dbg }};color:{{ r.dfg }};border:1.5px solid rgba(250,247,242,.2)">{{ r.label }}</div>
</sc-for>
</div>
<div style="margin:18px 20px 0;border-top:1px solid rgba(250,247,242,.14)">
<sc-for list="{{ wellRows }}" as="w" hint-placeholder-count="4">
<div style="display:flex;align-items:center;gap:14px;padding:13px 0;border-bottom:1px solid rgba(250,247,242,.14)">
<span style="width:78px;font:400 10px 'Space Mono',monospace;letter-spacing:.14em;opacity:.55">{{ w.label }}</span>
<svg viewBox="0 0 120 26" width="120" height="26" preserveAspectRatio="none"><path d="{{ w.path }}" fill="none" stroke="{{ w.color }}" stroke-width="2"></path></svg>
<span style="flex:1;text-align:right;font:700 15px 'Space Mono',monospace;font-variant-numeric:tabular-nums">{{ w.value }}</span>
<span style="width:52px;text-align:right;font:400 10px 'Space Mono',monospace;color:{{ w.deltaColor }}">{{ w.delta }}</span>
</div>
</sc-for>
</div>
<div style="position:absolute;left:14px;right:14px;bottom:20px;background:#FAF7F2;border-radius:999px;padding:7px;display:flex;gap:4px">
<div style="flex:1;padding:11px 0;text-align:center;font:400 10px 'Space Mono',monospace;letter-spacing:.1em;color:rgba(23,20,15,.5)">WEEK</div>
<div style="flex:1;padding:11px 0;text-align:center;font:400 10px 'Space Mono',monospace;letter-spacing:.1em;color:rgba(23,20,15,.5)">LOG</div>
<div style="flex:1;background:#FF6B54;border-radius:999px;padding:11px 0;text-align:center;font:700 10px 'Space Mono',monospace;letter-spacing:.1em;color:#17140F">FITNESS</div>
<div style="flex:1;padding:11px 0;text-align:center;font:400 10px 'Space Mono',monospace;letter-spacing:.1em;color:rgba(23,20,15,.5)">BODY</div>
</div>
</div>
</div>
