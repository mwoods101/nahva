name: intervals.icu sync

# Incremental sync of activities + wellness from intervals.icu into Supabase.
# The Strava CSV import is deliberately NOT here — it is a one-off local run
# (BUILD_BRIEF.md §6).
#
# Two schedules share this workflow:
#   */15 — fast: last 2 days only, so same-day workouts land quickly at a few
#          API calls per run. GitHub's cron is best-effort: runs typically start
#          10-20 min late and can be dropped under load, so expect ~15-35 min.
#   06:40 — daily: 30-day window plus the gate-C verify. By then Garmin has
#          normally pushed the previous night's sleep/HRV into intervals.icu,
#          and the wide window catches late edits. Upserts are idempotent, so
#          the overlapping windows are harmless. Kept off the :15 grid so it never
#          fires at the same instant as a fast run.

on:
  schedule:
    - cron: "*/15 * * * *"
    - cron: "40 6 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: "Days back to sync"
        required: false
        default: "30"

concurrency:
  group: intervals-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # The fast cron syncs 2 days; the daily cron and manual runs default to 30.
      FAST: ${{ github.event.schedule == '*/15 * * * *' }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          # Pinned to 3.12 deliberately. Python 3.14 on the dev machine ships an
          # empty TLS trust store (ssl.create_default_context() -> 0 CA certs),
          # which cost an hour of misdiagnosis; don't inherit that here.
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Sync intervals.icu -> Supabase
        env:
          # SUPABASE_DB_URL **must** be the session-pooler string
          # (aws-N-<region>.pooler.supabase.com:5432). The direct
          # db.<ref>.supabase.co host is IPv6-only — it has no A record — and
          # GitHub runners are IPv4, so the direct host will always fail here.
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          INTERVALS_API_KEY: ${{ secrets.INTERVALS_API_KEY }}
          INTERVALS_ATHLETE_ID: ${{ secrets.INTERVALS_ATHLETE_ID }}
          # Supabase's Root 2021 CA lacks a keyUsage extension, which OpenSSL 3
          # rejects. Traffic stays encrypted; CA verification is off.
          SUPABASE_DB_SSLMODE: require
        run: |
          python pipeline/intervals_sync.py --days "${{ env.FAST == 'true' && '2' || github.event.inputs.days || '30' }}"

      - name: Verify gate C
        if: env.FAST != 'true'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_DB_SSLMODE: require
        run: python pipeline/verify.py C
