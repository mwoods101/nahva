name: intervals.icu sync

# Daily incremental sync of activities + wellness from intervals.icu into
# Supabase. The Strava CSV import is deliberately NOT here — it is a one-off
# local run (BUILD_BRIEF.md §6).
#
# STATUS: not yet verified end-to-end. Requires the repository secrets below.

on:
  schedule:
    # 06:30 UTC daily — after Garmin has normally pushed the previous night's
    # sleep/HRV into intervals.icu.
    - cron: "30 6 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: "Days back to sync"
        required: false
        default: "30"

concurrency:
  group: intervals-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Pinned to 3.12 deliberately. Python 3.14 on the dev machine ships an
          # empty TLS trust store (ssl.create_default_context() -> 0 CA certs),
          # which cost an hour of misdiagnosis; don't inherit that here.
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Sync intervals.icu -> Supabase
        env:
          # SUPABASE_DB_URL **must** be the session-pooler string
          # (aws-N-<region>.pooler.supabase.com:5432). The direct
          # db.<ref>.supabase.co host is IPv6-only — it has no A record — and
          # GitHub runners are IPv4, so the direct host will always fail here.
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          INTERVALS_API_KEY: ${{ secrets.INTERVALS_API_KEY }}
          INTERVALS_ATHLETE_ID: ${{ secrets.INTERVALS_ATHLETE_ID }}
          # Supabase's Root 2021 CA lacks a keyUsage extension, which OpenSSL 3
          # rejects. Traffic stays encrypted; CA verification is off.
          SUPABASE_DB_SSLMODE: require
        run: |
          python pipeline/intervals_sync.py --days "${{ github.event.inputs.days || '30' }}"

      - name: Verify gate C
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_DB_SSLMODE: require
        run: python pipeline/verify.py C
